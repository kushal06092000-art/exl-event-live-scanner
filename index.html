<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>EXL Event QR Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:16px Arial;background:#f4f7f5;margin:0;color:#183329}.box{max-width:520px;margin:20px auto;padding:18px;background:white;border-radius:16px}button,input{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;font:inherit}button{background:#00843d;color:white}#reader{width:100%}.muted{color:#607267}</style></head><body><main class="box"><h2>EXL Event QR Scanner</h2><p class="muted">Scan the employee QR code. Check-in is not automatic; staff must confirm in the portal.</p><div id="reader"></div><p id="msg"></p><button id="start" onclick="startScan()">Start camera</button><button id="stop" onclick="stopScan()" style="display:none">Stop camera</button></main><script>
let scanner;const params=new URLSearchParams(location.search);const ret=params.get('return');function validReturn(){try{const u=new URL(ret);return u.protocol==='https:'&&u.hostname==='script.google.com';}catch(e){return false;}}
async function startScan(){if(!validReturn()){document.getElementById('msg').textContent='Scanner return URL is missing or invalid. Add ?return=YOUR_STAFF_WEB_APP_URL';return;}try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async text=>{await stopScan();const u=new URL(ret);u.searchParams.set('scan',text);location.href=u.toString();},()=>{});document.getElementById('start').style.display='none';document.getElementById('stop').style.display='block';}catch(e){document.getElementById('msg').textContent='Camera error: '+e;}}
async function stopScan(){if(scanner){try{await scanner.stop();scanner.clear();}catch(e){}}document.getElementById('start').style.display='block';document.getElementById('stop').style.display='none';}
</script></body></html>
